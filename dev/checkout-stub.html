<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripe Checkout (preview stub)</title>
<!--
  Where the local preview lands instead of Stripe. Development only.

  The order form ends by redirecting to the Checkout Session URL the payment
  service returns; with the service mocked there is no such page, and landing
  on about:blank makes it look like the form broke at the last step. This
  stands in for it, so the handoff is visible and the run can be repeated.
-->
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f4f4f6; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:#1a1a1a; }
  .card { background:#fff; border:1px solid #e3e3e8; border-radius:14px; padding:32px 36px; max-width:520px; text-align:center; box-shadow:0 6px 24px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 10px; }
  p { font-size:14px; line-height:1.55; color:#555; margin:0 0 16px; }
  code { background:#f2f2f5; padding:2px 6px; border-radius:5px; font-size:13px; }
  .tag { display:inline-block; margin-bottom:14px; padding:4px 12px; border-radius:999px; background:#FFD34D; color:#1a1a1a; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  a { color:#BD2135; font-weight:600; text-decoration:none; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">Preview stub</div>
    <h1>Stripe Checkout would open here</h1>
    <p>The order form handed off to the Checkout Session the payment service returned. Nothing was created and no card can be entered &mdash; the service is mocked in this preview.</p>
    <p>Session: <code id="session">unknown</code></p>
    <p><a href="hospitality-guide-preview.html">&larr; Back to the preview</a></p>
  </div>
<script>
  var id = new URLSearchParams(window.location.search).get("session");
  if (id) document.getElementById("session").textContent = id;
</script>
</body>
</html>
