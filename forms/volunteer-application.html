            });

            form.addEventListener('submit', handleSubmit);
        });

        function handleSelection(selectElement) {
            selectElement.addEventListener('click', (event) => {
                const option = event.target;
                if (option.tagName === 'OPTION') {
                    option.selected = !option.selected;
                }
            });
            selectElement.addEventListener('mousedown', (event) => {
                event.preventDefault();
            });
        }

        function populateSelect(elementId, options) {
            const select = document.getElementById(elementId);
            options.forEach(option => {
                const opt = document.createElement('option');
                opt.value = option;
                opt.innerHTML = option;
                select.appendChild(opt);
            });
        }

        function isVisible(element) {
            return element.offsetParent !== null;
        }

        function checkVisibility() {
            var selectElement = document.getElementById('ministrySafeCertificateUpload');
            const ministrySafeSelect = document.getElementById('ministrySafeCertificate');
            if (isVisible(selectElement) && ministrySafeSelect.value === 'Yes') {
                selectElement.setAttribute('required', 'required');
            } else {
                selectElement.removeAttribute('required');
            }
        }

        window.onload = checkVisibility;

        document.getElementById('volunteerForm').onsubmit = function () {
            checkVisibility();
            return true;
        };

        function submitForm(formData) {
            fetch('https://db6a711f4383e668bf1e88325abdab.17.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6607266b2e024806a5c92591df6aaeaf/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ooPSiZ5PqNZwKu8YVFutVnDDmHRbfnOo2ayJPxb33cE', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            }).then(response => {
                if (response.ok) {
                    window.location.href = 'http://www.refugeintl.org/appsubmitted/';
                } else {
                    alert('There was an error submitting the form. Please try again.');
                }
            }).catch(error => {
                console.error('Error:', error);
                alert('There was an error submitting the form. Please try again.');
            });
        }
        
        function handleSubmit(event) {
            console.log('Form submission initiated');
            event.preventDefault();

            const getSelectedValues = (selectElementId) => {
                const selectElement = document.getElementById(selectElementId);
                const selectedValues = [];
                for (let option of selectElement.options) {
                    if (option.selected) {
                        selectedValues.push(option.value);
                    }
                }
                return selectedValues;
            };

            const formData = {
                "Salutation": document.getElementById('salutation').value,
                "FirstName": document.getElementById('firstName').value,
                "LastName": document.getElementById('lastName').value,
                "Email": document.getElementById('email').value,
                "Phone": document.getElementById('phone').value,
                "Street": document.getElementById('street').value,
                "City": document.getElementById('city').value,
                "State": document.getElementById('state').value,
                "Zip": document.getElementById('zip').value,
                "Country": document.getElementById('country').value,
                "Church": document.getElementById('church').value,
                "Skills": getSelectedValues('skills'),
                "CurrentlyServing": document.getElementById('currentlyServing').value,
                "CountryOfOrigin": document.getElementById('countryOfOrigin').value,
                "Gender": document.getElementById('gender').value,
                "MaritalStatus": document.getElementById('maritalStatus').value,
                "Birthdate": document.getElementById('birthdate').value,
                "HeartLanguage": document.getElementById('heartLanguage').value,
                "LanguagesSpoken": getSelectedValues('languagesSpoken'),
                "PastoralReferenceSalutation": document.getElementById('pastoralReferenceSalutation').value,
                "PastoralReferenceFirstName": document.getElementById('pastoralReferenceFirstName').value,
                "PastoralReferenceLastName": document.getElementById('pastoralReferenceLastName').value,
                "PastoralReferenceEmail": document.getElementById('pastoralReferenceEmail').value,
                "Gospel": document.getElementById('gospel').value,
                "Testimony": document.getElementById('testimony').value,
                "AnythingElse": document.getElementById('anythingElse').value,
                "ECName": document.getElementById('ecName').value,
                "ECPhone": document.getElementById('ecPhone').value,
                "ECRelationship": document.getElementById('ecRelationship').value,
                "ServingInterest": getSelectedValues('servingInterest'),
                "ServingPreference": document.getElementById('servingPreference').value,
                "Availability": getSelectedValues('availability'),
                "HowHeard": getSelectedValues('howHeard'),
                "AbleToPay": document.getElementById('ableToPay').value ? document.getElementById('ableToPay').value : document.getElementById('ableToPayMinistrySafeBG').value,
                "MinistrySafeCertificate": document.getElementById('ministrySafeCertificate').value,
                "AffirmsStatementOfFaith": document.getElementById('Affirms_Statement_of_Faith').checked,
            };

            const ministrySafeCertificateUpload = document.getElementById('ministrySafeCertificateUpload');
            if (formData.MinistrySafeCertificate === 'Yes') {
                if (ministrySafeCertificateUpload.files.length === 0) {
                    alert('Please upload your MinistrySafe certificate.');
                    return;
                }
                const file = ministrySafeCertificateUpload.files[0];
                if (!file.type.includes('pdf')) {
                    alert('Please upload a PDF file.');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (e) {
                    const arrayBuffer = e.target.result;
                    const uint8Array = new Uint8Array(arrayBuffer);
                    const ansiByteArray = Array.from(uint8Array, byte => byte & 0xFF);
                    const base64String = btoa(String.fromCharCode.apply(null, ansiByteArray));
                    formData.MinistrySafeCertificatePDF = base64String;
                    console.log('Submitting form with file upload');
                    submitForm(formData);
                };
                reader.readAsArrayBuffer(file);
            } else {
                formData.MinistrySafeCertificateUpload = null;
                formData.MinistrySafeCertificatePDF = null;
                console.log('Submitting form without file upload');
                submitForm(formData);
            }
        }
    </script>

                    </div>
                    <div class="form-item">
                        <label for="servingPreference">Preferred Area? <span class="required">*</span></label>
                        <select id="servingPreference" name="ServingPreference" class="field-element" required></select>
                    </div>
                    <div class="form-item">
                        <label for="availability">General Availability <span class="required">*</span></label>
                        <select id="availability" multiple name="Availability" class="field-element select-multiple"
                            size="5" required></select>
                    </div>
                    <div class="form-item">
                        <label for="howHeard">How did you hear about us? <span class="required">*</span></label>
                        <select id="howHeard" multiple name="HowHeard" class="field-element select-multiple" size="5"
                            required></select>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-item">
                        <label for="ministrySafeCertificate">Have you completed a MinistrySafe training within the past
                            5 years? <span class="required">*</span></label>
                        <select id="ministrySafeCertificate" name="MinistrySafeCertificate" class="field-element" required>
                            <option value="">Please select</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" id="ministrySafeUploadGroup" style="display: none;">
                    <div class="form-item">
                        <label for="ministrySafeCertificate">Please provide a PDF of your MinistrySafe certificate <span
                                class="required">*</span></label>
                        <input type="file" id="ministrySafeCertificateUpload" name="MinistrySafeCertificateUpload"
                            class="field-element" accept=".pdf">
                    </div>
                    <div class="form-item">
                        <label for="ableToPay">Are you able to pay the $15 application processing fee?</label>
                        <select id="ableToPay" name="AbleToPay" class="field-element"></select>
                        <label class="caption">
                            <small class="form-text">This fee covers the cost of your background check since you're
                                providing the MinistrySafe Certificate. An invoice will be sent to you through our payment processor, Stripe, upon submission.<br>If paying would be burdensome for you, or you're volunteering in your local church's ESL ministry, please select "No" and email us at <a href="mailto:info@refugeintl.org">info@refugeintl.org</a> so we can help you move forward.</small>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="needMinistrySafeAndBGCheck" style="display: none;">
                    <div class="form-item">
                        <label for="ableToPayMinistrySafeBG">Are you able to pay the $20 application processing
                            fee?</label>
                        <select id="ableToPayMinistrySafeBG" name="AbleToPayMinistrySafeBG"
                            class="field-element"></select>
                        <label class="caption">
                            <small class="form-text">This fee covers the cost of your background check ($15) and
                                MinistrySafe training ($5). An invoice will be sent to you through our payment processor, Stripe, upon submission.<br>If paying would be burdensome for you, or you're volunteering in your local church's ESL ministry, please select "No" and email us at <a href="mailto:info@refugeintl.org">info@refugeintl.org</a> so we can help you move forward.</small>
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-item">
                        <label for="anythingElse">Is there anything else you would like us to know?</label>
                        <textarea id="anythingElse" name="AnythingElse" class="narrative" maxlength="1500"></textarea>
                    </div>
                </div>
                <div class="form-group">
                    <div class="form-item">
                        <input type="checkbox" id="Affirms_Statement_of_Faith" name="AffirmsStatementOfFaith" required>
                        <label for="Affirms_Statement_of_Faith">
                            &nbsp;I have read, and affirm, <a href="https://static1.squarespace.com/static/5af0bc3a96d45593d7d7e55b/t/675251913102604777fd712c/1733448082026/Refuge+International+Statement+Of+Faith-Rev.+9_25_23.pdf" target="_blank">Refuge International's statement of faith</a>.
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submit-button" disabled>Submit</button>
                </div>
                <div class="form-group">
                    <div class="form-item"><small class="form-text">By submitting this application, I agree to receive
                            occasional email updates and announcements related to Refuge International.</small></div>
                </div>
            </form>
        </div>
    </div>
    <script>
    
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('volunteerForm');
            const affirmCheckbox = document.getElementById('Affirms_Statement_of_Faith');
            const submitButton = document.getElementById('submit-button');
            const requiredFields = form.querySelectorAll('[required]');

            function updateSubmitState() {
                const allFilled = Array.from(requiredFields).every(input => input.value.trim() !== '' || (input.type === 'checkbox' && input.checked));
                if (affirmCheckbox.checked && allFilled) {
                    submitButton.disabled = false;
                } else {
                    submitButton.disabled = true;
                }
            }

            form.addEventListener('input', updateSubmitState);
            affirmCheckbox.addEventListener('change', updateSubmitState);
        });

    </script>
</body>
